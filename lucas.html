<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Lucas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .perfil {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            display: inline-block;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        .foto {
            font-size: 80px; /* Tamaño grande para el emoji */
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="perfil">
        <!-- Foto o Emoji -->
        <p class="foto">👨‍💻</p> 
        
        <!-- Nombre -->
        <h1>Lucas</h1>
        
        <!-- Carrera -->
        <p><strong>Carrera:</strong> Desarrollo de Software</p>
        
        <!-- Hobby -->
        <p><strong>Hobby:</strong> Jugar futbol y desarmar cosas</p>
    </div>

</body>
</html>
